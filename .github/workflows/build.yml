name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP"

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          echo "البحث عن gradlew..."

          GRADLEW=$(find android-project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على gradlew داخل ملف المشروع"
            echo "محتويات المشروع:"
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "تم العثور على المشروع:"
          echo "$PROJECT_DIR"

      - name: Make gradlew executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrostWaShawaya-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
