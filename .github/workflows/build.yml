name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف المشروع
        run: |
          mkdir -p app_source
          unzip -q BrostWaShawaya_V9_CloudBuild.zip -d app_source
          echo "محتويات المشروع:"
          find app_source -maxdepth 3 -type f | head -100

      - name: العثور على مشروع Android
        run: |
          GRADLEW=$(find app_source -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على gradlew داخل المشروع"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "تم العثور على المشروع:"
          echo "$PROJECT_DIR"

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: BrostWaShawaya-APK
          path: |
            app_source/**/build/outputs/apk/**/*.apk
